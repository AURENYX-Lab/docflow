[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docflow"
version = "0.1.0"
description = "Local PDF intake classification + audit + apply"
readme = "README.md"
requires-python = ">=3.12,<3.15"
dependencies = [
  "pydantic>=2.12,<3",
  "pyyaml>=6.0,<7",
  "requests>=2.32,<3",
  "pikepdf>=10.2,<11",
  "lxml>=6.0,<7",
  "pillow>=12.1,<13",
]

[project.scripts]
docflow = "docflow.cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docflow"]
