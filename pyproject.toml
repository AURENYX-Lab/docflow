[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docflow"
version = "0.1.0.dev0"
description = "Deterministic document pipeline for local archives"
readme = "README.md"
requires-python = ">=3.12,<3.15"

dependencies = [
  "pydantic>=2.12,<3",
  "pyyaml>=6.0,<7",
  "requests>=2.32,<3",
  "pikepdf>=10.2,<11",
  "lxml>=6.1.0,<7",
  "pillow>=12.3.0,<13",
]

[project.scripts]
docflow = "docflow.cli.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/docflow"]

[dependency-groups]
dev = [
    "pytest>=9.0.3",
    "pytest-cov>=7.0.0",
]
